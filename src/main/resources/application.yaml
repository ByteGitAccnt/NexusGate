spring:
  application:
    name: nexus-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://localhost:8081
              predicates:
               - Path=/api/v1/auth/**

            - id: order-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/order/**

            - id: product-service
              uri: http://localhost:8083
              predicates:
                - Path=/api/v1/product/**

management:
  endpoint:
    gateway:
      access: unrestricted
  endpoints:
    web:
      exposure:
        include: health,gateway

server:
  port: 8080