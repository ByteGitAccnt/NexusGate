
services:

  # NexusGate gateway without Redis dependency.
  nexusgate:
    image: nexusgate:v1
    container_name: nexusgate
    restart: unless-stopped

    ports:
      - "${SERVER_PORT:-8080}:8080"

    environment:
      SERVER_PORT: ${SERVER_PORT:-8080}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be configured in .env}

    volumes:
      # User-provided NexusGate configuration.
      - ./nexus.yml:/app/nexus.yml:ro

  # Collects metrics exposed by NexusGate's Actuator endpoint.
  prometheus:
    image: prom/prometheus:latest
    container_name: nexusgate-prometheus
    restart: unless-stopped

    volumes:
      # Mount the user's Prometheus configuration.
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Preserve collected metrics across container restarts.
      - prometheus-data:/prometheus

    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

    depends_on:
      - nexusgate

  # Provides dashboards for NexusGate metrics.
  grafana:
    image: grafana/grafana:latest
    container_name: nexusgate-grafana
    restart: unless-stopped

    ports:
      - "${GRAFANA_PORT:-3000}:3000"

    volumes:
      # Preserve dashboards and Grafana configuration.
      - grafana-data:/var/lib/grafana

      # Automatically provision Prometheus datasource.
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro

      # Automatically provision dashboard discovery.
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro

      # Mount NexusGate dashboard JSON files.
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
