services:
  auth:
    url: http://localhost:8081
    path: /api/v1/auth/**
    publicEndpoints:
      - /login
      - /register
      - /refresh
  product:
    url: http://localhost:8083
    path: /api/v1/product/**
    management:
      endpoints:
        - health
  order:
    url: http://localhost:8082
    path: /api/v1/order/**
    management:
      endpoints:
        - metrics

management:
  enabled: true
  basePath: /management
  targetPath: /actuator
  endpoints:
    - health
    - info

security:
  jwt:
    enabled: true
    algorithm: HS256
    identityClaim: userid

    verification:
      type: shared-secret
      secret: ${JWT_SECRET}

    issuer: http://localhost:8081
    audience: nexusgate

redis:
  host: ${REDIS_HOST}
  port: ${REDIS_PORT}

rateLimit:

  outer:
    enabled: true
    algorithm: token-bucket
    capacity: 5
    refillRate: 5
    refillPeriodSeconds: 60

  inner:
    enabled: false
    algorithm: token-bucket
    capacity: 100
    refillRate: 60
    refillPeriodSeconds: 60