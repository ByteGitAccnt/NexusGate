services:
  auth:
    url: http://localhost:8081
    path: /api/v1/auth/**

  product:
    url: http://localhost:8083
    path: /api/v1/product/**
    management:
      endpoints:
        - health

  order:
    url: http://localhost:8082
    path: /api/v1/order/**
    management:
      endpoints:
        - metrics

management:
  enabled: true
  basePath: /management
  targetPath: /actuator
  endpoints:
    - health
    - info

security:
  jwt:
    enabled: true
    algorithm: HS256

    verification:
      type: shared-secret
      secret: ${JWT_SECRET}

    issuer: http://localhost:8081
    audience: nexusgate